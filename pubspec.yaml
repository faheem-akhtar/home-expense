name: home_expense
description: Dual Expense Tracker - shared monthly budgets for two.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
